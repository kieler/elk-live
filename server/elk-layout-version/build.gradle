import groovy.json.JsonSlurper

def elkLayouters = [
    "org.eclipse.elk.alg.force",
    "org.eclipse.elk.alg.layered",
    "org.eclipse.elk.alg.mrtree",
    "org.eclipse.elk.alg.radial",
    "org.eclipse.elk.alg.disco",
    "org.eclipse.elk.alg.spore",
    "org.eclipse.elk.alg.rectpacking",
    "org.eclipse.elk.alg.vertiflex"
]

configurations {
    optionalLayouters {
        canBeConsumed = false
        canBeResolved = true
    }
}

def getJsonFromRest(String url) {
    def query = url
    logger.debug "Querying: $url"
    def request = new URL(query).openConnection()
    def json = new JsonSlurper().parseText(request.getInputStream().getText())
    return json
}

def isLayoutAlgorithmExistsForVersion(String algorithm, String version) {
    if (version.equals("elk-layout-version") || version.equals("snapshot")) {
        return false
    } else {
        def majorVersion = 0
        def minorVersion = 0
        def patchVersion = 0
        // Get major, minor and patch version from version string
        version.tokenize(".") with { major, minor, patch ->
            majorVersion = Integer.parseInt(major)
            minorVersion = Integer.parseInt(minor)
            patchVersion = Integer.parseInt(patch)
        }
        // Check that veriflex is supported
        if (algorithm.equals("org.eclipse.elk.alg.vertiflex") && minorVersion < 11) {
            return false
        }
        return true
    }
}

dependencies {
    implementation "org.eclipse.xtend:org.eclipse.xtend.lib:${versions.xtext}"
    
    // Explicitly included to make Eclipse's gradle plugin happy. It would be included transitively anyway
    if ("${project.name}".contains("elk-layout-version")) {
        implementation "org.eclipse.elk:org.eclipse.elk.core:${versions.elk}"
    }
    logger.info "Resolving available layouters for version ${project.name}"
    elkLayouters.each {
        if (isLayoutAlgorithmExistsForVersion("$it", "${project.name}")) {
            logger.info "\tFound $it"
            optionalLayouters "org.eclipse.elk:$it:${project.name}"
        }
    }
}

def bundledDependencies = {
    (configurations.runtimeClasspath.filter { it.exists() } +
        configurations.optionalLayouters.incoming.artifactView { lenient true }.files.files)
        .unique { it.name }
}

task copyLayoutDependencies(type: Copy) {
    from { bundledDependencies() }
    into "$buildDir/libs/dependencies"
}

jar {
    dependsOn copyLayoutDependencies
    manifest {
        attributes(
            // Keep the sandboxed layouter's runtime dependencies beside its jar.
            "Class-Path": bundledDependencies().collect { "dependencies/${it.name}" }.join(' ')
        )
    }
}
